<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đếm Ảnh</title>
<style>
:root{--bg:#f1f5f3;--fg:#10231e;--muted:#5f736d;--card:#fff;--acc:#0c7a66}
@media(prefers-color-scheme:dark){:root{--bg:#0b1210;--fg:#e8f1ee;--muted:#9bb0a9;--card:#15201d;--acc:#3fc2a8}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
main{width:min(92vw,420px);text-align:center;padding:24px 0}
.logo{width:72px;height:72px;border-radius:22px;margin:0 auto 12px;background:linear-gradient(135deg,#14a085,#0a6b5c);display:grid;place-items:center;font-size:34px}
h1{margin:6px 0}p{color:var(--muted)}
a.b{display:block;margin:10px 0;padding:14px;border-radius:14px;background:var(--card);color:var(--fg);text-decoration:none;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.08)}
a.p{background:linear-gradient(135deg,#14a085,#0a6b5c);color:#fff}
small{color:var(--muted)}
</style></head>
<body><main>
<div class="logo">📷</div><h1>Đếm Ảnh</h1>
<p>Chụp ảnh, AI đếm số lượng vật trong ảnh.</p>
<a class="b p" href="dem/">Mở ứng dụng web</a>
<a class="b" href="apk/">Tải ứng dụng Android (.apk)</a>
<small>Android: tải xong mở file, cho phép cài từ nguồn này nếu máy hỏi.</small>
<p style="font-size:13px;margin-top:22px">Tạo bởi Cao Hoài Ngọc</p>
</main></body></html>
